<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">어떤 리뷰를 할지 고르고, 코드를 읽어 판단합니다</title><desc id="desc">Decision1은 선택 역할입니다. 이 그림은 최근 실PR 검증에 사용한 TEV1 + Bonsai2 구성을 나타냅니다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#8093a6" stroke-width="1.5"/></marker></defs>
<rect x="1" y="1" width="1278" height="758" rx="12" fill="#fcfdff" stroke="#dce4ec"/>
<g font-family="sans-serif">
<text x="32" y="42" font-size="27" fill="#17354b" font-weight="700">어떤 리뷰를 할지 고르고, 코드를 읽어 판단합니다</text>
<text x="32" y="72" font-size="15" fill="#5c7283" font-weight="400">Decision1은 선택 역할입니다. 이 그림은 최근 실PR 검증에 사용한 TEV1 + Bonsai2 구성을 나타냅니다.</text>
<rect x="32" y="91" width="220" height="26" rx="5" fill="#fff1dc" stroke="#bd792e"/>
<text x="44" y="109" font-size="13" fill="#704214" font-weight="700">Decision1 · 선택 역할</text>
<rect x="264" y="91" width="206" height="26" rx="5" fill="#e5f4ed" stroke="#278270"/>
<text x="276" y="109" font-size="13" fill="#185b4d" font-weight="700">Bonsai2 · 검토·설명</text>
<rect x="482" y="91" width="230" height="26" rx="5" fill="#edf3fa" stroke="#486c96"/>
<text x="494" y="109" font-size="13" fill="#294a70" font-weight="700">프로그램 · 실행·근거·게시</text>
<rect x="32" y="213" width="210" height="143" rx="9" fill="white" stroke="#486c96"/>
<path d="M42 214H232" stroke="#486c96" stroke-width="3"/>
<rect x="48" y="227" width="178" height="26" rx="5" fill="#edf3fa" stroke="#486c96"/>
<text x="60" y="245" font-size="13" fill="#294a70" font-weight="700">PROGRAM</text>
<text x="227" y="248" font-size="15" fill="#788da0" font-weight="700" text-anchor="end">01</text>
<text x="50" y="282" font-size="21" fill="#17354b" font-weight="700">PR 입력 준비</text>
<text x="50" y="308" font-size="15" fill="#526a7b" font-weight="400">PR 목적 · 변경 전후 코드</text>
<text x="50" y="330" font-size="15" fill="#526a7b" font-weight="400">관련 테스트와 근거</text>
<rect x="286" y="201" width="266" height="167" rx="9" fill="white" stroke="#bd792e"/>
<path d="M296 202H542" stroke="#bd792e" stroke-width="3"/>
<rect x="302" y="215" width="208" height="26" rx="5" fill="#fff1dc" stroke="#bd792e"/>
<text x="314" y="233" font-size="13" fill="#704214" font-weight="700">Decision1 · 기준 TEV1</text>
<text x="537" y="236" font-size="15" fill="#788da0" font-weight="700" text-anchor="end">02</text>
<text x="304" y="270" font-size="21" fill="#17354b" font-weight="700">검토 계획과 종류 선택</text>
<text x="304" y="296" font-size="15" fill="#526a7b" font-weight="400">읽을 묶음과 검토 방법 선택</text>
<text x="304" y="318" font-size="15" fill="#526a7b" font-weight="400">필요한 의도 관점 N개 선택</text>
<text x="304" y="340" font-size="15" fill="#526a7b" font-weight="400">둘 다 / 하나 / 없음 가능</text>
<rect x="602" y="155" width="278" height="159" rx="9" fill="white" stroke="#278270"/>
<path d="M612 156H870" stroke="#278270" stroke-width="3"/>
<rect x="618" y="169" width="208" height="26" rx="5" fill="#e5f4ed" stroke="#278270"/>
<text x="630" y="187" font-size="13" fill="#185b4d" font-weight="700">Bonsai2 · 검토 모델</text>
<text x="865" y="190" font-size="15" fill="#788da0" font-weight="700" text-anchor="end">03</text>
<text x="620" y="224" font-size="21" fill="#17354b" font-weight="700">개발 의도 리뷰</text>
<text x="620" y="250" font-size="15" fill="#526a7b" font-weight="400">설명한 문제와 구현이 맞는가?</text>
<text x="620" y="272" font-size="15" fill="#526a7b" font-weight="400">선택된 N개 관점만 검토</text>
<rect x="602" y="383" width="278" height="143" rx="9" fill="white" stroke="#7762a5"/>
<path d="M612 384H870" stroke="#7762a5" stroke-width="3"/>
<rect x="618" y="397" width="208" height="26" rx="5" fill="#eeeafa" stroke="#7762a5"/>
<text x="630" y="415" font-size="13" fill="#504177" font-weight="700">PROGRAM · PMD / CPD</text>
<text x="620" y="452" font-size="21" fill="#17354b" font-weight="700">복잡도·중복 분석</text>
<text x="620" y="478" font-size="15" fill="#526a7b" font-weight="400">Java + Gradle · 선택 시</text>
<text x="620" y="500" font-size="15" fill="#526a7b" font-weight="400">리뷰봇 실행 노드에서 분석</text>
<rect x="602" y="540" width="278" height="132" rx="9" fill="white" stroke="#278270"/>
<path d="M612 541H870" stroke="#278270" stroke-width="3"/>
<rect x="618" y="554" width="208" height="26" rx="5" fill="#e5f4ed" stroke="#278270"/>
<text x="630" y="572" font-size="13" fill="#185b4d" font-weight="700">Bonsai2 · 검토 모델</text>
<text x="865" y="575" font-size="15" fill="#788da0" font-weight="700" text-anchor="end">03</text>
<text x="620" y="609" font-size="21" fill="#17354b" font-weight="700">아키텍처 리뷰</text>
<text x="620" y="635" font-size="15" fill="#526a7b" font-weight="400">복잡한 코드나 중복에</text>
<text x="620" y="657" font-size="15" fill="#526a7b" font-weight="400">실제로 개선이 필요한가?</text>
<rect x="944" y="231" width="302" height="159" rx="9" fill="white" stroke="#278270"/>
<path d="M954 232H1236" stroke="#278270" stroke-width="3"/>
<rect x="960" y="245" width="208" height="26" rx="5" fill="#e5f4ed" stroke="#278270"/>
<text x="972" y="263" font-size="13" fill="#185b4d" font-weight="700">Bonsai2 · 검토 모델</text>
<text x="1231" y="266" font-size="15" fill="#788da0" font-weight="700" text-anchor="end">04</text>
<text x="962" y="300" font-size="21" fill="#17354b" font-weight="700">최종 정리 · 사실 확인</text>
<text x="962" y="326" font-size="15" fill="#526a7b" font-weight="400">초안과 코드 원문을 대조</text>
<text x="962" y="348" font-size="15" fill="#526a7b" font-weight="400">각 리뷰의 실제 주장 확인</text>
<rect x="944" y="448" width="302" height="159" rx="9" fill="white" stroke="#486c96"/>
<path d="M954 449H1236" stroke="#486c96" stroke-width="3"/>
<rect x="960" y="462" width="208" height="26" rx="5" fill="#edf3fa" stroke="#486c96"/>
<text x="972" y="480" font-size="13" fill="#294a70" font-weight="700">PROGRAM · 실행 책임</text>
<text x="1231" y="483" font-size="15" fill="#788da0" font-weight="700" text-anchor="end">05</text>
<text x="962" y="517" font-size="21" fill="#17354b" font-weight="700">근거 첨부 · 댓글 갱신</text>
<text x="962" y="543" font-size="15" fill="#526a7b" font-weight="400">코드 원문 · 파일 · 행을 연결</text>
<text x="962" y="565" font-size="15" fill="#526a7b" font-weight="400">완료된 리뷰별로 전달</text>
<path d="M242 285L286 285" fill="none" stroke="#8093a6" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M552 250L574 250L574 234L602 234" fill="none" stroke="#8093a6" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M420 368L420 444L602 444" fill="none" stroke="#8093a6" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="435" y="431" font-size="13" fill="#5c7283" font-weight="600">아키텍처 선택 시</text>
<path d="M741 526L741 540" fill="none" stroke="#8093a6" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M880 234L911 234L911 310L944 310" fill="none" stroke="#8093a6" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M880 605L911 605L911 310L944 310" fill="none" stroke="#8093a6" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1095 390L1095 448" fill="none" stroke="#8093a6" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="32" y="695" width="1216" height="50" rx="6" fill="#f0f4f7" stroke="#dce4ec"/>
<text x="48" y="721" font-size="14" fill="#4f6879" font-weight="400">선택 모델은 계획·종류·관점을 고릅니다. Bonsai2가 실제 원문을 읽어 판단하고, 프로그램이 분석·인용·게시를 실행합니다.</text>
</g></svg>
